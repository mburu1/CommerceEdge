name: Security

on:
  schedule:
    - cron: '0 2 * * 1'
  push:
    branches: [main]

jobs:
  dotnet-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet list package --vulnerable --include-transitive

  npm-audit-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/commerce-edge-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm audit --audit-level=high

  npm-audit-pos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos/CommerceEdge.POS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm audit --audit-level=high
