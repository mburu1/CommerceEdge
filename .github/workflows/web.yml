name: Web

on:
  workflow_call:
  push:
    paths:
      - 'web/**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/commerce-edge-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/commerce-edge-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
