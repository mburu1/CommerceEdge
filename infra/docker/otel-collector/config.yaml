receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  otlp/http:
    endpoint: 0.0.0.0:4319
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ['localhost:8888']
        - job_name: commercceedge-api
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ['api:8080']
        - job_name: commercceedge-scale-unit
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ['scale-unit:8080']
        - job_name: commercceedge-hardware-station
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ['hardware-station:8080']
  hostmetrics:
    collectors:
      cpu:
      memory:
      disk:
      network:

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: insert
  attributes:
    actions:
      - key: http.method
        action: insert
        value: method

exporters:
  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8888
    send_interval: 10s
  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true
  zipkin:
    endpoint: http://jaeger:9411/api/v2/spans
  logging:
    loglevel: info
  azuremonitor:
    connection_string: ${AZURE_MONITOR_CONNECTION_STRING}

service:
  pipelines:
    traces:
      receivers: [otlp, otlp/http]
      processors: [batch, memory_limiter, resource]
      exporters: [otlp, jaeger, zipkin, azuremonitor, logging]
    metrics:
      receivers: [otlp, prometheus, hostmetrics]
      processors: [batch, memory_limiter, resource]
      exporters: [prometheus, azuremonitor, logging]
    logs:
      receivers: [otlp]
      processors: [batch, memory_limiter, resource]
      exporters: [azuremonitor, logging]
