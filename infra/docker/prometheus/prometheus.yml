global:
  scrape_interval: 15s
  evaluation_interval: 15s
  alerting:
    alertmanagers: []
    rule_files:
      - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: commerceedge-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8080

  - job_name: commerceedge-scale-unit
    metrics_path: /metrics
    static_configs:
      - targets:
          - scale-unit:8080

  - job_name: commerceedge-hardware-station
    metrics_path: /metrics
    static_configs:
      - targets:
          - hardware-station:8080
